name: Publish release

on:
  push:
    branches: [main]
    paths: [pyproject.toml, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create source archive and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          mkdir -p dist
          mapfile -t paths < <(git ls-tree --name-only HEAD | grep -v '^v[0-9]')
          git archive --format=zip --output="dist/yastreb-rag-$tag-source.zip" HEAD -- "${paths[@]}"
          (cd dist && sha256sum "yastreb-rag-$tag-source.zip" > SHA256SUMS)
          gh release create "$tag" "dist/yastreb-rag-$tag-source.zip" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Ястреб $tag" \
            --notes-file "docs/releases/$tag.md"
